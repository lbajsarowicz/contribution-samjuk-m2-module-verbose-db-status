name: Continuous Integration

on:
  push:
    branches:
      - test/magento-watch-matrix

permissions:
  contents: read

jobs:
  supported-versions:
    name: Supported Versions
    uses: lbajsarowicz/contribution-samjuk-github-actions/.github/workflows/magento-supported-versions.yaml@feat/magento-watch-matrix
    with:
      php: boundaries

  phpunit:
    name: PHPUnit Tests (GHAS)
    needs: supported-versions
    uses: samjuk/github-actions/.github/workflows/magento2-test-phpunit-module-ghas.yaml@master
    with:
      module_path: ./extensions/${{ github.event.repository.name }}
      magento_version: ${{ matrix.version }}
      magento_distribution: ${{ matrix.distribution }}
      php_version: ${{ matrix.php }}
      run_unit_tests: true
      run_integration_tests: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.supported-versions.outputs.versions) }}
